<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGC作品集 - AIGC视频作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #ff2020; border-radius: 3px; }

        a { color: inherit; text-decoration: none; }

        /* ===== BACK BUTTON ===== */
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #ff5050;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(255,50,50,0.3);
            border-radius: 3px;
            background: rgba(11,11,11,0.9);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .back:hover {
            background: rgba(255,50,50,0.1);
            border-color: #ff5050;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            padding: 100px 40px 40px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }

        .page-header h1 {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .page-header .subtitle {
            font-size: 13px;
            color: #444;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .page-tip {
            font-size: 12px;
            color: rgba(255, 50, 50, 0.5);
            margin-top: 20px;
        }

        /* ===== CARDS GRID ===== */
        .cards-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 40px 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .card {
            background: #111;
            border: 1px solid rgba(255,32,32,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.3s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
        }

        .card:hover {
            border-color: rgba(255,32,32,0.35);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(255,20,20,0.08);
        }

        .card-cover {
            width: 100%;
            height: 200px;
            overflow: hidden;
            position: relative;
        }

        .card-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .card:hover .card-cover img {
            transform: scale(1.05);
        }

        .card-body {
            padding: 28px 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .card-num {
            font-size: 36px;
            font-weight: 900;
            font-style: italic;
            color: rgba(255,32,32,0.15);
            line-height: 1;
            margin-bottom: 6px;
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .card-title-en {
            font-size: 10px;
            color: #444;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .card-desc {
            font-size: 13px;
            color: #666;
            line-height: 1.8;
            flex: 1;
            margin-bottom: 20px;
        }

        /* ===== ACTIVE CARD STATE ===== */
        .card.active {
            border-color: rgba(255,32,32,0.6);
            box-shadow: 0 12px 40px rgba(255,20,20,0.12);
        }

        /* ===== DETAIL PANEL ===== */
        .detail-panel {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 80px;
        }

        .detail-content {
            display: none;
            background: #111;
            border: 1px solid rgba(255,32,32,0.15);
            padding: 40px;
            animation: fadeSlideIn 0.35s ease;
        }

        .detail-content.active {
            display: block;
        }

        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .detail-header {
            display: flex;
            align-items: baseline;
            gap: 16px;
            margin-bottom: 6px;
        }

        .detail-num {
            font-size: 48px;
            font-weight: 900;
            font-style: italic;
            color: rgba(255,32,32,0.15);
            line-height: 1;
        }

        .detail-title {
            font-size: 26px;
            font-weight: 800;
            color: #fff;
        }

        .detail-title-en {
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .detail-desc {
            font-size: 14px;
            color: #888;
            line-height: 1.8;
            margin-bottom: 20px;
            max-width: 700px;
        }

        .detail-body {
            font-size: 14px;
            color: #999;
            line-height: 1.8;
        }

        .detail-close {
            float: right;
            background: none;
            border: 1px solid rgba(255,50,50,0.3);
            color: #ff5050;
            font-size: 13px;
            padding: 6px 14px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .detail-close:hover {
            background: rgba(255,50,50,0.1);
            border-color: #ff5050;
        }

        /* ===== RADIO GROUP ===== */
        .radio-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(255,255,255,0.02);
        }

        .radio-item:hover {
            border-color: rgba(255,50,50,0.4);
            background: rgba(255,50,50,0.05);
        }

        .radio-item input[type="radio"] {
            appearance: none;
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border: 2px solid #444;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .radio-item input[type="radio"]:checked {
            border-color: #ff5050;
        }

        .radio-item input[type="radio"]:checked::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 8px;
            height: 8px;
            background: #ff5050;
            border-radius: 50%;
        }

        .radio-item:has(input:checked) {
            border-color: rgba(255,50,50,0.6);
            background: rgba(255,50,50,0.08);
        }

        .radio-label {
            font-size: 14px;
            color: #ccc;
        }

        /* ===== SHOWCASE ===== */
        .showcase {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 80px;
        }

        .showcase-item {
            display: none;
            background: #111;
            border: 1px solid rgba(255,32,32,0.15);
            padding: 36px;
            animation: fadeSlideIn 0.35s ease;
        }

        .showcase-item.active {
            display: block;
        }

        .showcase-title {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255,32,32,0.1);
        }

        .showcase-media {
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }

        .showcase-media .video-wrap {
            width: 100%;
            max-width: 720px;
            background: #000;
            border-radius: 4px;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .showcase-media video {
            width: 100%;
            max-height: 420px;
            border-radius: 3px;
            display: block;
        }

        .showcase-media img {
            width: 100%;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 960px) {
            .cards-wrap {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .page-header {
                padding: 80px 20px 20px;
            }

            }

            .cards-wrap {

                padding: 20px 20px 60px;
                gap: 16px;
            }

            .card-cover {
                height: 160px;
            }

            .back {
                top: 12px;
                left: 12px;
                font-size: 12px;
                padding: 6px 12px;
            }
        }
    </style>
</head>

<script>
(function() {
    var radios = document.querySelectorAll('input[type="radio"]');
    var items = document.querySelectorAll('.showcase-item');

    radios.forEach(function(radio) {
        radio.addEventListener('change', function() {
            var group = this.name;
            var value = this.value;

            // Hide all showcase items
            items.forEach(function(item) { item.classList.remove('active'); });

            // Uncheck other groups' radios
            radios.forEach(function(r) {
                if (r.name !== group) r.checked = false;
            });

            // Show matching item
            var target = document.querySelector('.showcase-item[data-group="' + group + '"][data-value="' + value + '"]');
            if (target) {
                target.classList.add('active');
                setTimeout(function() {
                    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 50);
            }
        });
    });
})();
</script>
