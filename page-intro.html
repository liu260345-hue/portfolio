<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历介绍 - AIGC视频作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #ff2020; border-radius: 3px; }

        a { color: inherit; text-decoration: none; }

        /* ===== BACK BUTTON ===== */
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #ff5050;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(255,50,50,0.3);
            border-radius: 3px;
            background: rgba(11,11,11,0.9);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .back:hover {
            background: rgba(255,50,50,0.1);
            border-color: #ff5050;
        }

        /* ===== HERO COVER ===== */
        .hero {
            width: 100%;
            background: #0b0b0b;
        }

        .hero-cover {
            width: 100%;
        }

        .hero-cover img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== PROFILE CARD ===== */
        .profile-section {
            max-width: 1100px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .profile-card {
            background: #111;
            border: 1px solid rgba(255,32,32,0.15);
            display: flex;
            align-items: stretch;
            overflow: hidden;
        }

        .profile-left {
            width: 320px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding: 30px;
            background: #0a0a0a;
        }

        .profile-left .avatar {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            object-fit: cover;
        }

        .profile-left .name-block {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px 0;
        }

        .profile-left .name-block h2 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .profile-left .name-block .subtitle {
            font-size: 13px;
            color: #888;
            letter-spacing: 1px;
        }

        .profile-right {
            flex: 1;
            padding: 50px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .profile-right .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .profile-right .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 700;
        }

        .profile-right .section-title .slash {
            color: #ff2020;
            font-weight: 900;
            font-size: 24px;
        }

        .profile-right .section-en {
            font-size: 12px;
            color: #333;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .profile-right .bio {
            color: #999;
            font-size: 14px;
            line-height: 2;
        }

        .profile-right .bio p {
            margin-bottom: 12px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 860px) {
            .profile-card {
                flex-direction: column;
            }

            .profile-left {
                width: 100%;
                height: 360px;
            }

            .profile-right {
                padding: 30px;
            }
        }

        @media (max-width: 768px) {
            .back {
                top: 12px;
                left: 12px;
                font-size: 12px;
                padding: 6px 12px;
            }

            .profile-section {
                padding: 30px 16px;
            }

            .profile-left {
                height: 300px;
            }

            .profile-right {
                padding: 24px 20px;
            }

            .profile-right .section-title {
                font-size: 18px;
            }

            .profile-right .bio {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back">&larr; 返回首页</a>

    <div class="hero">
        <div class="hero-cover">
            <img src="intro-cover.png" alt="个人简历介绍">
        </div>
    </div>

    <div class="profile-section">
        <div class="profile-card">
            <div class="profile-left">
                <img class="avatar" src="sec-01.png" alt="但俊">
                <div class="name-block">
                    <h2>但俊</h2>
                    <div class="subtitle">AIGC视觉创作者</div>
                </div>
            </div>
            <div class="profile-right">
                <div class="section-header">
                    <div class="section-title">
                        <span class="slash">/</span> 个人简介
                    </div>
                    <div class="section-en">ABOUT ME</div>
                </div>
                <div class="bio">
                    <p>专注于 AI 视觉内容创作，擅长将创意与技术结合，打造具有视觉冲击力和传播力的内容。</p>
                    <p>致力于通过 AI 技术探索更多可能性，助力品牌与内容在视觉时代脱颖而出。</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
