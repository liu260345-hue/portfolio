<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人简历介绍 - AIGC视频作品集</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #ff2020; border-radius: 3px; }

        a { color: inherit; text-decoration: none; }

        /* ===== BACK BUTTON ===== */
        .back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: #ff5050;
            font-size: 13px;
            text-decoration: none;
            padding: 8px 16px;
            border: 1px solid rgba(255,50,50,0.3);
            border-radius: 3px;
            background: rgba(11,11,11,0.9);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .back:hover {
            background: rgba(255,50,50,0.1);
            border-color: #ff5050;
        }

        /* ===== HERO COVER ===== */
        .hero {
            width: 100%;
            background: #0b0b0b;
        }

        .hero-cover {
            width: 100%;
        }

        .hero-cover img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== RESUME DETAIL ===== */
        .resume-detail {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .resume-detail img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid rgba(255,32,32,0.15);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .back {
                top: 12px;
                left: 12px;
                font-size: 12px;
                padding: 6px 12px;
            }

            .resume-detail {
                padding: 0 16px;
            }
        }
    </style>
</head>
<body>
    <a href="portfolio.html" class="back">&larr; 返回首页</a>

    <div class="hero">
        <div class="hero-cover">
            <img src="intro-cover.png" alt="个人简历介绍">
        </div>
    </div>

    <div class="resume-detail">
        <img src="resume-detail.png" alt="个人简历详情">
    </div>


</body>
</html>
