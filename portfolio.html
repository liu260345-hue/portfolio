<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIGC视频作品集 - 但俊</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0b0b0b;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            overflow-x: hidden;
            line-height: 1.5;
        }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #0b0b0b; }
        ::-webkit-scrollbar-thumb { background: #ff2020; border-radius: 3px; }

        a { color: inherit; text-decoration: none; }

        /* ===== TOP BAR ===== */
        .topbar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 1000;
            height: 60px;
            background: rgba(11,11,11,0.95);
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255,32,32,0.08);
        }

        .topbar-inner {
            display: flex;
            align-items: center;
            width: 100%;
        }

        .topbar-logo {
            height: 32px;
            flex-shrink: 0;
        }

        .topbar-logo img {
            height: 100%;
            width: auto;
            display: block;
        }

        .topbar-nav {
            display: flex;
            gap: 36px;
            align-items: center;
            margin: 0 auto;
        }

        .topbar-nav a {
            font-size: 16px;
            color: #888;
            text-decoration: none;
            padding: 8px 12px;
            transition: color 0.3s;
        }

        .topbar-nav a:hover {
            color: #fff;
        }

        .topbar-nav a.active {
            color: #ff2020;
            font-weight: 600;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            margin-left: auto;
        }

        /* ===== HERO ===== */
        .hero {
            width: 100%;
            margin-top: 60px;
            background: #0b0b0b;
        }

        .hero-cover {
            width: 100%;
        }

        .hero-cover img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== SECTIONS ===== */
        .sections-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 40px;
        }

        .sec {
            width: 100%;
            border-top: 1px solid #1a1a1a;
            display: flex;
            align-items: stretch;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: background 0.3s;
            text-decoration: none;
            color: inherit;
        }

        .sec:hover {
            background: rgba(255, 20, 20, 0.02);
        }

        .sec-left {
            width: 400px;
            flex-shrink: 0;
            padding: 50px 50px 50px 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .sec-num {
            font-size: 54px;
            font-weight: 900;
            font-style: italic;
            color: rgba(255, 32, 32, 0.15);
            line-height: 1;
            margin-bottom: 8px;
        }

        .sec-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #fff;
        }

        .sec-title-en {
            font-size: 11px;
            color: #444;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .sec-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 20px;
        }

        .sec-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #ff5050;
            padding: 9px 20px;
            border: 1px solid rgba(255, 50, 50, 0.35);
            border-radius: 3px;
            transition: all 0.3s;
            background: rgba(255, 50, 50, 0.05);
            width: fit-content;
        }

        .sec-btn:hover {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.6);
            transform: translateX(4px);
        }

        .sec-btn::after {
            content: '\2192';
        }

        .sec-right {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .sec-right img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s;
        }

        .sec:hover .sec-right img {
            transform: scale(1.02);
        }

        /* Left fade overlay on section image */
        .sec-right::before {
            content: '';
            position: absolute;
            top: 0; bottom: 0; left: 0;
            width: 80px;
            background: linear-gradient(90deg, #0b0b0b, transparent);
            z-index: 1;
        }

        /* ===== FOOTER ===== */
        .footer {
            max-width: 1300px;
            margin: 0 auto;
            padding: 30px 40px;
            border-top: 1px solid #151515;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: #444;
        }

        .footer a { color: #666; }
        .footer a:hover { color: #ff4040; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1100px) {
            .sec-left { width: 280px; padding: 30px; }
        }

        @media (max-width: 860px) {
            .topbar { padding: 0 20px; }
            .topbar-right { display: none; }
            .mobile-menu-btn { display: block; }

            .sec {
                flex-direction: column;
            }

            .sec-left {
                width: 100%;
                padding: 24px 20px;
            }

            .sec-right {
                height: 200px;
            }

            .sec-right::before {
                width: 0;
            }

            .footer { padding: 24px 20px; flex-direction: column; gap: 8px; }
        }

        @media (max-width: 520px) {
            .sec-title { font-size: 18px; }
            .sec-num { font-size: 32px; }
            .sec-right { height: 160px; }
        }
    </style>
</head>
<body>

<!-- Top Bar -->
<header class="topbar">
    <div class="topbar-inner">
        <div class="topbar-logo"><img src="logo.png" alt="AIGC视频作品集"></div>
        <nav class="topbar-nav">
        </nav>
        <div class="topbar-right">
        </div>
    </div>
    <button class="mobile-menu-btn" id="menuBtn">&#9776;</button>
</header>

<!-- Hero -->
<section class="hero" id="top">
    <div class="hero-cover">
        <img src="hero-cover.png" alt="AIGC视频作品集">
    </div>
</section>

<!-- Sections -->
<div class="sections-wrap">

<!-- Section 01 -->
<a class="sec" id="sec-intro" href="page-intro.html">
    <div class="sec-left">
        <div class="sec-num">01</div>
        <h2 class="sec-title">个人简历介绍</h2>
        <div class="sec-title-en">PERSONAL PROFILE</div>
        <p class="sec-desc">视频剪辑，后期制作，AIGC技术与视觉叙事的融合创新</p>
        <span class="sec-btn">进入查看</span>
    </div>
    <div class="sec-right">
        <img src="sec-01.png" alt="个人简历介绍">
    </div>
</a>

<!-- Section 02 -->
<a class="sec" id="sec-aigc" href="page-aigc.html">
    <div class="sec-left">
        <div class="sec-num">02</div>
        <h2 class="sec-title">AIGC视频作品集</h2>
        <div class="sec-title-en">AIGC PORTFOLIO</div>
        <p class="sec-desc">AI信息流视频 / AI品牌广告视频 / AI漫剧 —— 全方位展示AIGC技术驱动的视频创作成果。</p>
        <span class="sec-btn">进入查看</span>
    </div>
    <div class="sec-right">
        <img src="sec-aigc.png" alt="AIGC视频作品集">
    </div>
</a>



</div><!-- end sections-wrap -->

<!-- Footer -->
<footer class="footer">
    <span>但俊 &mdash; AIGC视频作品集</span>

</footer>

<script>
(function(){
    // Smooth scroll for nav links
    document.querySelectorAll('.topbar-nav a').forEach(function(a){
        a.addEventListener('click', function(e){
            var href = a.getAttribute('href');
            if(href.startsWith('#')){
                e.preventDefault();
                var t = document.querySelector(href);
                if(t){
                    var y = t.getBoundingClientRect().top + window.pageYOffset - 56;
                    window.scrollTo({top: y, behavior: 'smooth'});
                }
                document.querySelectorAll('.topbar-nav a').forEach(function(l){ l.classList.remove('active'); });
                a.classList.add('active');
            }
        });
    });

    // Highlight nav on scroll
    var navLinks = document.querySelectorAll('.topbar-nav a');
    var sections = document.querySelectorAll('.sec[id], .hero[id]');
    window.addEventListener('scroll', function(){
        var scrollY = window.pageYOffset + 100;
        var current = '';
        sections.forEach(function(s){
            if(s.offsetTop <= scrollY) current = s.id;
        });
        navLinks.forEach(function(l){
            l.classList.toggle('active', l.getAttribute('href') === '#' + current);
        });
    });

    // Intersection observer for fade in sections
    var obs = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
            if(entry.isIntersecting){
                entry.target.style.opacity = '1';
                entry.target.style.transform = 'translateY(0)';
            }
        });
    }, {threshold: 0.1});

    document.querySelectorAll('.sec').forEach(function(sec, i){
        sec.style.opacity = '0';
        sec.style.transform = 'translateY(20px)';
        sec.style.transition = 'all 0.5s ' + (i * 0.1) + 's ease';
        obs.observe(sec);
    });
})();
</script>


</body>
</html>
